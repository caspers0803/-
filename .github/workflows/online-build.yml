name: 線上自動打包 APK

on:
  workflow_dispatch: # 允許在 GitHub 網頁上手動點選按鈕執行
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的免費雲端 Linux 主機

    steps:
    - name: 1. 抓取 GitHub 上的 HTML 專案
      uses: actions/checkout@v4

    - name: 2. 在雲端配置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. 在雲端配置 Java (編譯 Android 必備)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. 自動整合 HTML 並使用 Capacitor 打包
      run: |
        mkdir -p www
        rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "WebApp" "com.online.webapp" --web-dir www
        npx cap add android
        npx cap sync android

    - name: 5. 執行雲端編譯出 APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 6. 輸出 APK 下載點
      uses: actions/upload-artifact@v4
      with:
        name: Online-Generated-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
